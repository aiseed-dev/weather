# アメダス地点別取得。1 エリア分をまとめて point/{YYYYMMDD}/{HH}/{area}.json へ置く。
#
# **cron は持たない** — deb2 が呼ぶ。いつ・何を取るかを決めるのは deb2 側に
# 寄せる（日付の切り替わりや取りこぼしの追跡を 1 箇所に集めるため）。
#
# 親子 2 本だったものを 1 本にした。分けた理由は「1 実行 50 サブリクエスト」
# だったが、エリア単位にまとめた時点で 1 エリア＝最大 48 に収まる。加えて
# cf-publish 0.3.1 に Service Binding の対応が無く、親が子を呼ぶ形は
# デプロイできない。
#
# デプロイ（合言葉は同名の環境変数から読まれ、値は表示されない）:
#   TOKEN=... cf-publish worker deploy . --secret TOKEN --workers-dev
name = "amedas-point"
main = "worker.js"
compatibility_date = "2026-08-28"

[[r2_buckets]]
binding = "AMEDAS"
bucket_name = "weather-amedas"
