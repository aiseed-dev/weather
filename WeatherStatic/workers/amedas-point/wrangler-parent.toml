# アメダス地点別取得の親。**cron は持たない** — tgsvr が呼ぶ。
# いつ・何を取るかを決めるのは tgsvr 側（日付の切り替わりや取りこぼしの
# 追跡を 1 箇所に集めるため）。Worker は重い取得を肩代わりする手足。
#
# 合言葉は秘密として入れる（値は出力されない）:
#   cf-publish worker deploy . --main parent.js --name amedas-point \
#       --secret TOKEN --service CHILD=amedas-point-child
name = "amedas-point"
main = "parent.js"
compatibility_date = "2026-08-28"

[[services]]
binding = "CHILD"
service = "amedas-point-child"
