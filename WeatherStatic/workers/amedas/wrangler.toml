# アメダス 10 分値の収集 Worker。
#
# 気象庁から取得したペイロードを**一切加工せず**そのまま R2 へ置く。
# 加工（NetCDF への封入・品質フラグの分解）は tgsvr 側で行う。
# Workers の無料枠は CPU 10ms・メモリ 128MB なので、重い処理は載らない。
#
# デプロイ:
#   wrangler r2 bucket create weather-amedas
#   wrangler deploy
#   wrangler tail                     # cron の実行ログを見る
#
# 公開（任意。ミラーを外部へ出す場合）:
#   ダッシュボード → R2 → weather-amedas → Settings → Custom Domain
#   例 amedas.time-j.net を割り当てる。egress は無料。
#   Worker は公開エンドポイントにしないこと（無料枠 10 万リクエスト/日を
#   訪問者が食い潰すため、読み出しは R2 に直接行かせる）。

name = "amedas-collector"
main = "worker.js"
compatibility_date = "2026-08-27"

# 10 分ごと。気象庁の更新間隔に合わせている（これ以上速くしても新しい値は出ない）
[triggers]
crons = ["*/10 * * * *"]

[[r2_buckets]]
binding = "AMEDAS"
bucket_name = "weather-amedas"

# 手動実行用トークン。設定しないと /run は常に 403 になる（既定で閉じている）
#   wrangler secret put RUN_TOKEN
[observability]
enabled = true
