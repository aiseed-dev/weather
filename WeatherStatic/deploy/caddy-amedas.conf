# アメダス現況ミラーを公開するための Caddy 設定（/etc/caddy/Caddyfile に追記する）。
#
# 役割: サイト訪問者ごとに走っていた気象庁への直接アクセスを肩代わりする。
#       取得は fetch_amedas_mirror.py が 10 分に 1 回行い、ここは出来た
#       ファイルを配るだけ（このサーバーは気象庁を叩かない）。
#
# 前提:
#   - 公開は Cloudflare のプロキシ経由（DNS はプロキシ有効＝オレンジ雲）
#   - Cloudflare Origin CA 証明書をオリジンに置く（既存の certs と同じ流儀）
#
# 反映:  sudo caddy validate --config /etc/caddy/Caddyfile
#        sudo systemctl reload caddy

amedas.time-j.net {
	tls /etc/caddy/certs/time-j-net.crt /etc/caddy/certs/time-j-net.key

	# プロキシ以外からの直接アクセスを拒む。オリジン IP が知られても
	# Cloudflare を迂回されないようにするため（WAF・レート制限を素通りさせない）。
	# 一覧は https://www.cloudflare.com/ips/ で更新される。増減したら追記すること。
	@not_cf not remote_ip 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 \
 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 \
 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 \
 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 \
 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 \
 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
	respond @not_cf 403

	root * /home/claude/dev/weather/WeatherStatic/public_amedas
	encode gzip zstd
	file_server

	# 訪問者は誰でも読める（気象庁のデータを出典つきで再配布している）
	header Access-Control-Allow-Origin "*"
	header X-Content-Type-Options "nosniff"
	header Referrer-Policy "no-referrer"

	# 10 分更新なので最新系は短命、確定したスロットは不変として扱う。
	# Cloudflare 側もこの値を尊重するので、エッジで吸収される。
	@live path /latest.json /latest_time.txt /index.json
	header @live Cache-Control "public, max-age=120, stale-while-revalidate=600"
	@frozen path /map/* /archive/*
	header @frozen Cache-Control "public, max-age=31536000, immutable"

	log {
		output file /var/log/caddy/amedas.log {
			roll_size 20mb
			roll_keep 5
		}
	}
}
