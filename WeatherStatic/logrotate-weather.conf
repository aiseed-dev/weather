# deb2 の cron の記録（~/dev/weather/logs/*.log）を週ごとに回す。
#
# 置き方（root の持ち物にする。logrotate は書き換えられる設定を読まないので、リンクではなく写す）:
#   sudo install -m 644 -o root -g root ~/dev/weather/WeatherStatic/logrotate-weather.conf /etc/logrotate.d/weather
# 回すのは Debian の logrotate.timer（毎日 0 時台）。cron は足さない。
#
# cron は毎回 >> で開き直すので、移すだけで次の実行が新しいファイルを作る（create・copytruncate は要らない）。
# 10 分ごとの status.log が 10 日で約 9MB 増えるので、週ごと・12 週分、2 週目から圧縮。
# 急に増えたとき（取得の失敗が続くなど）に備え、50MB を超えたら週の途中でも回す。
/home/dev/dev/weather/logs/*.log {
    su dev dev
    weekly
    maxsize 50M
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    dateext
    dateformat -%Y%m%d
}
