{# AIseed Weather の案内ページ（/App/・/App/Forecast/）の共通のスタイル。色は site.css の CSS 変数だけ #}
<style>
    .app-hero { background: linear-gradient(135deg, var(--sky-from), var(--sky-to));
        color: #fff; border-radius: var(--radius); padding: 32px 28px; margin: 12px 10px 22px; }
    /* site.css の .main-section h2（濃い字と左の線）が後から当たるので、同じ強さ以上で白に戻す */
    .main-section .app-hero h2 { margin: 0 0 10px; font-size: 26px; line-height: 1.35;
        color: #fff; border-left: none; padding-left: 0; background: none; }
    .app-hero p { margin: 0 0 6px; font-size: 15px; opacity: .95; max-width: 46em; }
    .app-hero .lede { font-size: 17px; opacity: 1; }
    .app-sec { margin: 0 10px 26px; }
    .app-sec h3 { font-size: 19px; border-left: 4px solid var(--accent);
        padding-left: 10px; margin: 0 0 12px; }
    .app-grid { display: grid; gap: 14px;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .app-card { background: var(--card); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 16px 18px; }
    .app-card h4 { margin: 0 0 6px; font-size: 15px; color: var(--accent-dark); }
    .app-card p { margin: 0; font-size: 13.5px; color: var(--muted); line-height: 1.65; }
    .app-table { width: 100%; border-collapse: collapse; background: var(--card);
        border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .app-table th, .app-table td { border-bottom: 1px solid var(--border);
        padding: 9px 12px; font-size: 13.5px; text-align: left; vertical-align: top; }
    .app-table th { background: var(--th-bg); color: var(--th-text); white-space: nowrap; }
    .app-table tr:last-child td { border-bottom: none; }
    .app-note { background: var(--panel); border: 1px solid var(--border);
        border-left: 4px solid var(--accent); border-radius: 8px;
        padding: 12px 16px; font-size: 13.5px; color: var(--muted); line-height: 1.7; }
    .app-code { background: var(--panel); border: 1px solid var(--border);
        border-radius: 8px; padding: 12px 14px; overflow-x: auto; }
    .app-code pre { margin: 0; background: none; border: none; padding: 0;
        font-size: 13px; color: var(--text); white-space: pre; }
    .app-flow { width: 100%; height: auto; max-width: 760px; display: block; margin: 0 auto; }
    .app-links a { display: inline-block; margin: 0 14px 8px 0; font-size: 14px; }
    .app-badge { display: inline-block; background: var(--accent-light); color: var(--accent-dark);
        border-radius: 999px; padding: 2px 11px; font-size: 12px; margin-right: 6px; }
    .app-cta { margin-top: 16px !important; display: flex; flex-wrap: wrap; gap: 10px; }
    .app-btn { display: inline-block; padding: 8px 18px; border-radius: 999px; font-size: 14px; font-weight: 600;
        border: 1px solid rgba(255,255,255,.7); color: #fff; background: rgba(255,255,255,.12); cursor: pointer; }
    .app-btn:hover, .app-btn:focus { color: #fff; text-decoration: none; background: rgba(255,255,255,.25); }
    .app-btn-main { background: #fff; color: var(--accent-dark); border-color: #fff; }
    .app-btn-main:hover, .app-btn-main:focus { background: var(--accent-light); color: var(--accent-dark); }
    .app-mobile-note { display: none; margin: 0 10px 22px; padding: 14px 16px; border-radius: var(--radius);
        background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--accent);
        font-size: 14px; line-height: 1.8; }
    .app-mobile-note .app-btn { margin-top: 8px; border-color: var(--accent); background: var(--accent); color: #fff; }
    .app-share-done { margin-left: 8px; color: var(--muted); font-size: 13px; }
    /* 指で触る端末だけに出す（幅だけで決めると、狭いウィンドウのパソコンにも出る） */
    @media (pointer: coarse) { .app-mobile-note { display: block; } }
    .app-shots { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
    .fc-shot { margin: 0 0 16px; }
    .fc-shot img { width: 100%; height: auto; border: 1px solid var(--border); border-radius: 8px; display: block; }
    .fc-shot figcaption { font-size: 12.5px; color: var(--muted); margin-top: 6px; line-height: 1.6; }
    .app-code { position: relative; }
    .app-copy { position: absolute; top: 8px; right: 8px; font-size: 12px; padding: 3px 10px; border-radius: 6px;
        border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }
    @media (max-width: 600px) { .app-hero { padding: 24px 18px; } .app-hero h2 { font-size: 21px; } }
</style>
