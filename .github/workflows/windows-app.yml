# AIseed Weather の Windows 版（Python ごとまとめたアプリ）を、GitHub の Windows の機械で組み立てる。
# 試験を流してから desktop/ を flet build windows し、成果物（artifact）として 14 日残す。
# 組み立ての中身は desktop/pyproject.toml。手元では win11（仮想環境）で同じことを確かめている。
name: windows-app

# main ではアプリと組み立ての中身が変わったときだけ流す（サイトの変更では流さない）。
# app-v* のタグを打つと、組み立てた zip を GitHub の Release（試験版）に載せる。タグは運用者が打つ
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "desktop/**"
      - "packages/flet-gpufield/**"
      - "pyproject.toml"
      - ".github/workflows/windows-app.yml"
    tags: ["app-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write   # タグのときに Release を作る
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: アプリの部品と試験の道具
        run: |
          python -m pip install --upgrade pip
          python -m pip install eccodes cfgrib ecmwf-opendata xarray netcdf4 zarr fsspec s3fs numpy pandas scipy matplotlib cartopy pyproj contourpy pillow platformdirs httpx polars "flet==1.0.4" pytest pytest-asyncio
          python -m pip install -e . -e packages/flet-gpufield

      - name: 試験
        run: python -m pytest -q tests

      - name: 組み立て
        working-directory: desktop
        run: |
          python -m pip install "flet-cli==1.0.4"
          flet build windows --yes

      - uses: actions/upload-artifact@v4
        with:
          name: aiseed-weather-windows
          path: desktop/build/windows
          retention-days: 14

      - name: Release に載せる（app-v* のタグのとき）
        if: startsWith(github.ref, 'refs/tags/app-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 展開したときに 1 つのフォルダーにまとまるように
          Rename-Item .\desktop\build\windows "AIseed Weather"
          $zip = "AIseed-Weather-windows-${{ github.ref_name }}.zip"
          7z a -tzip -mx=7 $zip ".\desktop\build\AIseed Weather" | Out-Null
          gh release create "${{ github.ref_name }}" $zip --prerelease --title "AIseed Weather ${{ github.ref_name }}（Windows 試験版）" --notes "Windows 10/11（64 ビット）。zip を展開し、AIseed Weather.exe を起動してください。初めての起動は 1 分ほどかかります。"

