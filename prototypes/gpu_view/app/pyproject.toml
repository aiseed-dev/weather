[project]
name = "gpu-view-prototype"
version = "0.1.0"
description = "GPU で気象の格子データを描く試作アプリ（AIseed Weather）"
requires-python = ">=3.10"
authors = [{ name = "Yasuhiro" }]
license = "AGPL-3.0-or-later"
dependencies = [
    "flet==1.0.4",
    "flet-gpufield",
]

[tool.flet]
org = "dev.aiseed"
product = "GPU 描画の試作"
company = "AIseed"
copyright = "Copyright (c) 2026 Yasuhiro"

[tool.flet.app]
path = "src"

# 自作の部品は手元の版を使う（flet build がこのパスから入れ、Flutter 側も組み込む）
[tool.flet.dev_packages]
flet-gpufield = "../flet-gpufield"
