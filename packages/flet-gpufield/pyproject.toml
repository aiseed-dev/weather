[project]
name = "flet-gpufield"
version = "0.1.0"
description = "気象の格子データを GPU で描く Flet の部品（試作）"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yasuhiro" }]
license = "AGPL-3.0-or-later"
dependencies = [
    "flet>=1.0.4",
]

[dependency-groups]
dev = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]"
]

[tool.setuptools.package-data]
"flutter.flet_gpufield" = ["**/*"]

[tool.setuptools]
license-files = ["LICENSE"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
